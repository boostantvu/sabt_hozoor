<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت حضور هفتگی استاد</title>
  <style>
    /* ---------- متغیرها ---------- */
:root {
  --teal: #1fa89a;
  --teal-dark: #127c72;
  --blue: #1d5fd1;
  --ink: #1c2b2d;
  --muted: #40595b;
  --line: #d6e6e4;
  --danger: #b3261e;
}

@font-face {
    font-family: 'samim';
    src: url('font/Samim.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

@font-face {
    font-family: 'samim';
    src: url('font/Samim-Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
}
/* ---------- پایه ---------- */
* { 
    box-sizing: border-box;
    font-family: "Samim", sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 28px 14px;
  font-family: Vazirmatn, Vazir, Tahoma, "Segoe UI", sans-serif;
  line-height: 1.8;
  color: var(--ink);
  background-color: #69bfb7;
  background-image:
    linear-gradient(45deg, rgba(255,255,255,.07) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.07) 75%),
    linear-gradient(45deg, rgba(255,255,255,.07) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.07) 75%);
  background-size: 48px 48px;
  background-position: 0 0, 24px 24px;
}

.hidden { display: none; }

/* ---------- کارت ---------- */
.card {
  width: 100%;
  max-width: 820px;
  padding: 32px 26px;
  background: #fff;
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(0, 50, 45, .25);
}

h1 {
  margin: 0 0 6px;
  text-align: center;
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--teal-dark);
}

.hint {
  margin: 0 0 24px;
  text-align: center;
  color: var(--muted);
}

/* ---------- جدول ---------- */
.table-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line);
  border-radius: 16px;
}

table {
  width: 100%;
  min-width: 520px;
  border-collapse: collapse;
  text-align: center;
}

th, td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
}

thead th {
  position: sticky;
  top: 0;
  background: var(--teal-dark);
  color: #fff;
  font-weight: 800;
  font-size: .95rem;
  padding: 12px 8px;
}

tbody tr:nth-child(even) { background: #f4fbfa; }
tbody tr:last-child td   { border-bottom: 0; }
tbody th { font-weight: 700; color: var(--teal-dark); }

/* ---------- چک‌باکس ---------- */
.check {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 44px;
  cursor: pointer;
  border-radius: 10px;
}


.check input {
  appearance: none;
  -webkit-appearance: none;
  width: 28px;
  height: 28px;
  margin: 0;
  display: grid;
  place-content: center;
  background: #fff;
  border: 1px solid #7aa7a2;
  border-radius: 7px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}

.check input::after {
  content: "";
  width: 8px;
  height: 14px;
  border: solid #fff;
  border-width: 0 3px 3px 0;
  transform: rotate(45deg) scale(0);
  /* transition: transform .12s; */
}

.check input:checked { background: var(--teal); border-color: var(--teal-dark); }
.check input:checked::after { transform: rotate(45deg) scale(1); }
.check input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- پیام و دکمه ---------- */
.message {
  min-height: 1.8em;
  margin: 12px 0 4px;
  text-align: center;
  font-weight: 700;
}
.message.error { color: var(--danger); }

.btn {
  display: block;
  width: 100%;
  max-width: 360px;
  margin: 8px auto 0;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: var(--teal-dark);
  color: #fff;
  font: inherit;
  font-size: 1.2rem;
  font-weight: 800;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { background: var(--teal); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* ---------- صفحه‌ی تولد ---------- */
.birthday {
  position: relative;
  overflow: hidden;
  padding: 60px 26px;
  text-align: center;
}
.birthday h1 { font-size: 2.2rem; }
.birthday p  { max-width: 480px; margin: 12px auto 26px; font-size: 1.15rem; }
.birthday h1, .birthday p, .birthday .btn { position: relative; z-index: 1; }

.decor { position: absolute; inset: 0; pointer-events: none; }

.balloon, .confetti { position: absolute; opacity: .4; }

.balloon {
  bottom: -90px;
  width: 36px;
  height: 46px;
  border-radius: 50%;
  animation: rise 9s linear infinite;
}
.balloon::after {
  content: "";
  position: absolute;
  top: 100%;
  left: 50%;
  width: 1px;
  height: 30px;
  background: #888;
}

.confetti {
  top: -20px;
  width: 9px;
  height: 14px;
  animation: fall 6s linear infinite;
}

@keyframes rise { to { transform: translateY(-130vh); } }
@keyframes fall { to { transform: translateY(130vh) rotate(540deg); } }

@media (prefers-reduced-motion: reduce) {
  .balloon, .confetti { animation: none; }
  .balloon { bottom: 10%; }
  .confetti { top: 10%; }
}

/* ---------- موبایل ---------- */
@media (max-width: 600px) {
  .card { padding: 22px 12px; border-radius: 18px; }
  h1 { font-size: 1.4rem; }
  .birthday h1 { font-size: 1.7rem; }
  thead th { font-size: .8rem; padding: 10px 4px; }
  .check input { width: 24px; height: 24px; }
}
#xxx{
  display: flex;
}
#ccc{
  /* background-color: rgb(80, 80, 80); */
  width: 50%;
  border: 1px solid black;
}
#vvv{
  width: 50%;
  border: 1px solid black;
}
  </style>
</head>
<body>

  <!-- صفحه‌ی ثبت حضور -->
  <main class="card" id="attendance-page">
    <h1>ثبت حضور هفتگی اساتید</h1>
    <p class="hint">برای هر درس، هفته‌هایی را که در آن‌ها حضور داشته‌اید علامت بزنید.</p>
    <div id="xxx">
      <div id="ccc">
          <h5>نام استاد دروس : زهرا پوریافر</h5>
          <h6 style="margin-top: -20px;">کد ملی : 78******57 </h6>
          <h6 style="margin-top: -20px;">شماره تماس : 9549***0939</h6>
          <!-- <h6 style="margin-top: -20px;">جنسیت : زن</h6> -->
      </div>
      <div id="vvv">
        <h5>آموزشکده : پسران علی آباد کتول</h5>
        <h6 style="margin-top: -20px;">کد آموزشکده : 954876321</h6>
        <h6 style="margin-top: -20px;">کدپستی : ۴۹۴۱۷۱۵۵۱۹</h6>
      </div>
    </div>
    <br>
    <!-- <h5 style="direction: ltr; margin-top: -42px;">دانشگاه ملی و مهارت</h5> -->
    

    <form id="attendance-form" novalidate>
      <div class="table-scroll">
        <table id="attendance-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <p class="message" id="message" role="alert"></p>
      <button type="submit" class="btn">ثبت حضور</button>
    </form>
  </main>


  <main class="card birthday hidden" id="birthday-page">
    <div class="decor" id="decor" aria-hidden="true"></div>
    <a href="#" class="btn" id="back-button">بازگشت به ثبت حضور</a>
  </main>

  <script>
    "use strict";

/* ---------- داده‌ها ---------- */
const COURSES = ["ریاضی عمومی", "ریاضی کاربردی", "معادلات دیفرانسیل", "آمار و احتمالات"];
const WEEKS_COUNT = 9;

/* ---------- عناصر صفحه ---------- */
const form           = document.getElementById("attendance-form");
const tableHead      = document.querySelector("#attendance-table thead");
const tableBody      = document.querySelector("#attendance-table tbody");
const message        = document.getElementById("message");
const attendancePage = document.getElementById("attendance-page");
const birthdayPage   = document.getElementById("birthday-page");
const backButton     = document.getElementById("back-button");

/* ---------- کمکی‌ها ---------- */
const toPersianDigits = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);

/* ---------- ساخت جدول: درس‌ها ستون، هفته‌ها ردیف ---------- */
function buildTable() {
  const headCells = COURSES.map((course) => `<th scope="col">${course}</th>`).join("");
  tableHead.innerHTML = `<tr><th scope="col">هفته</th>${headCells}</tr>`;

  for (let week = 1; week <= WEEKS_COUNT; week++) {
    const cells = COURSES.map((course, courseIndex) => `
      <td>
        <label class="check">
          <input type="checkbox"
                 data-course="${courseIndex}"
                 data-week="${week}"
                 aria-label="حضور در هفته‌ی ${toPersianDigits(week)}، ${course}">
        </label>
      </td>`).join("");

    tableBody.insertAdjacentHTML(
      "beforeend",
      `<tr><th scope="row">${toPersianDigits(week)}</th>${cells}</tr>`
    );
  }
}

/* ---------- خواندن انتخاب‌ها ----------
   خروجی: { "ریاضی عمومی": [1, 3, 4], "ریاضی کاربردی": [], ... } */
function collectAttendance() {
  const result = Object.fromEntries(COURSES.map((course) => [course, []]));
  form.querySelectorAll("input:checked").forEach((input) => {
    result[COURSES[input.dataset.course]].push(Number(input.dataset.week));
  });
  return result;
}

/* ---------- جابه‌جایی بین صفحه‌ها ---------- */
function showBirthdayPage() {
  attendancePage.classList.add("hidden");
  birthdayPage.classList.remove("hidden");
  window.scrollTo(0, 0);
  birthdayPage.querySelector("h1").focus();
}

function showAttendancePage() {
  birthdayPage.classList.add("hidden");
  attendancePage.classList.remove("hidden");
  window.scrollTo(0, 0);
}

/* ---------- کلیک روی «ثبت حضور» ---------- */
form.addEventListener("submit", (event) => {
  event.preventDefault();

  // TODO: اینجا را خودتان پر کنید.
  // کمک‌ها:
  //   collectAttendance()  ← انتخاب‌های کاربر
  //   message.textContent = "..."; message.className = "message error";  ← نمایش پیام
  window.location.href = "birth_news.html"; //   ← رفتن به صفحه‌ی تبریک
});

backButton.addEventListener("click", (event) => {
  event.preventDefault();
  showAttendancePage();
});

/* ---------- تزئینات صفحه‌ی تولد ---------- */
function buildDecor() {
  const decor  = document.getElementById("decor");
  const colors = ["#f06292", "#ffb300", "#1fa89a", "#1d5fd1", "#8e24aa"];

  const add = (className, count, style) => {
    for (let i = 0; i < count; i++) {
      const el = document.createElement("i");
      el.className = className;
      el.style.cssText = style(i);
      decor.appendChild(el);
    }
  };

  add("balloon", 10, (i) =>
    `left:${i * 10 + Math.random() * 6}%;background:${colors[i % 5]};` +
    `animation-delay:${-Math.random() * 9}s;animation-duration:${8 + Math.random() * 4}s`);

  add("confetti", 24, (i) =>
    `left:${Math.random() * 100}%;background:${colors[i % 5]};` +
    `animation-delay:${-Math.random() * 6}s;animation-duration:${5 + Math.random() * 3}s`);
}

/* ---------- شروع ---------- */
buildTable();
buildDecor();

  </script>
</body>
</html>
